<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decision Analysis Tool</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="hdr-logo">📊</div>
        <div class="hdr-content">
            <div class="hdr-title">Decision Analysis</div>
            <div class="hdr-sub">Analysis & Evaluation Tool</div>
        </div>
        <div class="hdr-right">
            <button class="hdr-btn" id="exportBtn">Export</button>
            <button class="hdr-btn primary" id="analyzeBtn">Analyze</button>
        </div>
    </header>

    <div class="layout">
        <!-- Left Panel -->
        <div class="left">
            <div class="form-scroll">
                <div class="section-title">Decision Problem</div>
                
                <div class="fg">
                    <label>Decision Name</label>
                    <input type="text" id="decisionName" placeholder="e.g., Project Investment Strategy">
                </div>

                <div class="fg">
                    <label>Description</label>
                    <textarea id="decisionDesc" placeholder="Describe the decision context..."></textarea>
                </div>

                <div class="section-title" style="margin-top: 18px;">Alternatives</div>
                <div id="alternativesContainer"></div>
                <button class="add-btn" onclick="addAlternative()">+ Add Alternative</button>

                <div class="section-title" style="margin-top: 18px;">Criteria</div>
                <div id="criteriaContainer"></div>
                <button class="add-btn" onclick="addCriteria()">+ Add Criterion</button>

                <button class="analyze-btn" onclick="performAnalysis()">Run Analysis</button>
            </div>
        </div>

        <!-- Right Panel -->
        <div class="right">
            <div class="tabs">
                <button class="tab-btn active" data-tab="matrix">Decision Matrix</button>
                <button class="tab-btn" data-tab="analysis">Analysis Results</button>
                <button class="tab-btn" data-tab="chart">Visualization</button>
            </div>

            <div id="matrix" class="tab-pane active">
                <div class="matrix-container">
                    <div id="matrixContent" class="no-data">
                        <div class="nd-icon">📋</div>
                        <p>Create alternatives and criteria to build a decision matrix</p>
                    </div>
                </div>
            </div>

            <div id="analysis" class="tab-pane">
                <div class="results-container">
                    <div id="resultsContent" class="no-data">
                        <div class="nd-icon">📈</div>
                        <p>Analysis results will appear here</p>
                    </div>
                </div>
            </div>

            <div id="chart" class="tab-pane">
                <div class="chart-container">
                    <canvas id="analysisChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
